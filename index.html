<html lang="mn">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Manrope is self-hosted (src/styles/fonts.css → /fonts/*.woff2); no Google Fonts request. -->
    <link rel="preload" href="/fonts/manrope-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-700-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />

    <!-- PWA / iOS home screen. The manifest link is injected by vite-plugin-pwa; do not add one here. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChampStep" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>ChampStep — Achievements Journal</title>

    <meta property="og:image" content="https://www.champstep.mn/og.png" />
    <meta property="og:image:secure_url" content="https://www.champstep.mn/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
